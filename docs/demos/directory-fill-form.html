<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>项目通讯录 · Skill5 Demo Project</title>
  <style>
    :root {
      --paper: #e7e4de;
      --card: #fbfaf6;
      --ink: #1c1917;
      --muted: #6b6560;
      --line: #d4cfc6;
      --stripe: #e2b93b;
      --stamp: #8b2e2e;
      --stamp-ink: #fff8f0;
      --ok: #2f5d50;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      background:
        linear-gradient(90deg, var(--stripe) 0 10px, transparent 10px),
        var(--paper);
      color: var(--ink);
    }
    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(28, 25, 23, 0.08);
      padding: 22px 18px 20px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }
    h1 {
      font-size: 22px;
      font-weight: 650;
      margin: 0 0 6px;
      letter-spacing: 0.02em;
    }
    .lede {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 12px 0 6px;
    }
    select, input {
      width: 100%;
      font: inherit;
      font-size: 16px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 0;
    }
    .person {
      border-top: 1px dashed var(--line);
      margin-top: 16px;
      padding-top: 4px;
    }
    .person-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 8px;
    }
    .person-head span { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
    button {
      font: inherit;
      cursor: pointer;
    }
    .ghost {
      background: none;
      border: 0;
      color: var(--stamp);
      font-size: 12px;
      padding: 0;
    }
    .row-btns {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    .row-btns button {
      flex: 1;
      padding: 13px 10px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--card);
      font-size: 15px;
    }
    .row-btns .secondary {
      background: transparent;
      color: var(--ink);
    }
    .hint {
      margin: 14px 0 0;
      font-size: 12px;
      color: var(--ok);
      min-height: 1.2em;
    }
    .preview {
      margin-top: 16px;
      padding: 12px;
      background: #f3f0ea;
      border: 1px dashed var(--line);
      font-size: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="eyebrow">Project Directory</p>
      <h1>Skill5 Demo Project</h1>
      <p class="lede">填完点「复制回群」。不用发邮件。一位对接人一块，可继续加。有问题找 张三。</p>
      <label for="pkg">采购包</label>
      <select id="pkg"></select>
      <div id="people"></div>
      <div class="row-btns">
        <button type="button" class="secondary" id="add">再加一位</button>
        <button type="button" id="copy">复制回群</button>
      </div>
      <p class="hint" id="hint"></p>
      <pre class="preview" id="preview"></pre>
    </div>
  </main>
  <script>
    const PACKAGES = [{"seq": "01", "package_name": "BMS", "supplier_name": "Schneider Electric (China) Co., Ltd.", "supplier_short": "Schneider"}, {"seq": "02", "package_name": "HVAC", "supplier_name": "Carrier China", "supplier_short": "Carrier"}];
    const peopleEl = document.getElementById("people");
    const pkgEl = document.getElementById("pkg");
    const hint = document.getElementById("hint");
    const preview = document.getElementById("preview");

    PACKAGES.forEach((p, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      const sup = p.supplier_short || p.supplier_name || "";
      opt.textContent = [p.seq, p.package_name, sup].filter(Boolean).join(" · ");
      pkgEl.appendChild(opt);
    });

    function personCard() {
      const wrap = document.createElement("div");
      wrap.className = "person";
      wrap.innerHTML = `
        <div class="person-head">
          <span>对接人</span>
          <button type="button" class="ghost rm">删除</button>
        </div>
        <label>姓名 / Name</label>
        <input data-k="name" autocomplete="name" />
        <label>Title</label>
        <input data-k="title" placeholder="项目经理 / 现场负责人 / 商务" />
        <label>手机 / Mobile</label>
        <input data-k="phone" inputmode="tel" autocomplete="tel" />
        <label>邮箱 / Email</label>
        <input data-k="email" inputmode="email" autocomplete="email" />
      `;
      wrap.querySelector(".rm").addEventListener("click", () => {
        if (peopleEl.children.length === 1) return;
        wrap.remove();
        render();
      });
      wrap.querySelectorAll("input").forEach((el) => el.addEventListener("input", render));
      return wrap;
    }

    function addPerson() {
      peopleEl.appendChild(personCard());
      render();
    }

    function currentPkg() {
      return PACKAGES[Number(pkgEl.value)] || PACKAGES[0] || { package_name: "", supplier_name: "" };
    }

    function readPeople() {
      return [...peopleEl.querySelectorAll(".person")].map((card) => {
        const get = (k) => (card.querySelector(`[data-k="${k}"]`).value || "").trim();
        return { name: get("name"), title: get("title"), phone: get("phone"), email: get("email") };
      }).filter((p) => p.name || p.phone || p.email);
    }

    function buildMessage() {
      const pkg = currentPkg();
      const people = readPeople();
      const blocks = people.length ? people : [{ name: "", title: "", phone: "", email: "" }];
      let out = `[PDIR]\n采购包：${pkg.package_name || ""}\n供应商：${pkg.supplier_name || pkg.supplier_short || ""}\n`;
      blocks.forEach((p) => {
        out += `\n---\n姓名 / Name：${p.name}\nTitle：${p.title}\n手机 / Mobile：${p.phone}\n邮箱 / Email：${p.email}\n`;
      });
      out += "---\n";
      return out;
    }

    function render() {
      preview.textContent = buildMessage();
    }

    function copyText(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      if (ok) return Promise.resolve();
      if (navigator.clipboard) return navigator.clipboard.writeText(text);
      return Promise.reject(new Error("copy failed"));
    }

    document.getElementById("add").addEventListener("click", addPerson);
    pkgEl.addEventListener("change", render);
    document.getElementById("copy").addEventListener("click", () => {
      const msg = buildMessage();
      copyText(msg).then(() => {
        hint.textContent = "已复制。回到群里长按粘贴发出即可。";
      }).catch(() => {
        hint.textContent = "复制失败：请手动选中下方预览复制。";
      });
    });

    addPerson();
  </script>
</body>
</html>
