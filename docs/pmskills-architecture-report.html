<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PM Skills - 供应商管理系列</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1f24;
    --muted: #66727d;
    --faint: #939ca6;
    --bg: #f7f8f9;
    --panel: #fff;
    --line: #e2e6ea;
    --accent: #216e68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    line-height: 1.55;
    background: var(--bg);
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .series-intro {
    margin: 0 0 28px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--muted);
  }
  .series-intro p {
    margin: 0;
  }
  .series-intro strong {
    color: var(--ink);
    font-weight: 600;
  }
  .intent-box {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-left: 3px solid var(--accent);
    background: #f7f5f1;
  }
  .intent-box .t {
    margin: 0 0 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }
  .intent-box .b {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 14px 18px; margin: 0 0 12px; }
  a.demo {
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 1px solid transparent;
  }
  a.demo:hover { border-bottom-color: var(--accent); }
  a.demo:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .tabs {
    display: flex; gap: 4px; margin: 0 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .pill {
    appearance: none; border: 0; background: transparent;
    padding: 10px 12px 9px; margin-bottom: -1px;
    font: 500 14px/1 "Noto Sans SC", sans-serif;
    color: var(--muted); cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .pill:hover { color: var(--ink); }
  .pill.active { color: var(--ink); border-bottom-color: var(--ink); }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .filters .pill {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 10px;
    margin: 0;
    font-size: 12px;
    background: var(--panel);
  }
  .filters .pill.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .card, .demo-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 18px 18px 16px;
    margin-bottom: 12px;
  }
  .demo-card .title { font-weight: 600; font-size: 16px; margin: 0 0 6px; }
  .demo-card .meta { font-size: 14px; color: var(--muted); margin: 0 0 12px; }

  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; margin-bottom: 6px; gap: 8px; font-size: 15px;
  }
  .badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; color: var(--muted);
    font-weight: 400;
  }

  h2 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.info td { background: #fafbfc; }

  .step-block { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .step-block:last-child { border-bottom: 0; }
  .step-block .n { font-size: 13px; font-weight: 600; }
  .step-block .d { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .list { margin: 0; padding: 0; list-style: none; }
  .list li { font-size: 13px; margin: 3px 0; }
  .list.muted li { color: var(--muted); }

  .io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 720px) { .io-grid { grid-template-columns: 1fr; } }
  .io-box { background: var(--bg); padding: 12px; }
  .io-box .k { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .io-box ul { margin: 0; padding: 0; list-style: none; }
  .io-box li { font-size: 13px; margin: 5px 0; }
  .io-box .fmt {
    font-family: "IBM Plex Mono", monospace;
    color: var(--faint); font-size: 11px; margin-left: 4px;
  }
  .io-box a.io-demo {
    display: inline-block;
    margin-left: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .io-box a.io-demo:hover { border-bottom-color: var(--accent); }

  .note-box { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .note-box .t { font-size: 13px; font-weight: 600; }
  .note-box .b { font-size: 13px; color: var(--muted); }


  .detail-summary {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
    margin: 4px 0 10px;
  }
  .detail-meta {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .detail-meta code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--ink);
    background: #eef1f3;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .detail-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .detail-section.is-primary {
    border-top: 0;
    padding-top: 4px;
    margin-top: 10px;
  }
  .detail-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--faint);
    margin: 0 0 10px;
  }
  .detail-section.is-primary .detail-label {
    color: var(--ink);
    font-size: 13px;
  }
  .detail-section.is-secondary .detail-label,
  .detail-section.is-secondary li,
  .detail-section.is-secondary .note-box .b {
    color: var(--muted);
  }
  .flow-steps { margin: 0; padding: 0; list-style: none; }
  .flow-step {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .flow-step:last-child { border-bottom: 0; }
  .flow-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    display: grid;
    place-items: center;
    margin-top: 1px;
  }
  .flow-step .n { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .flow-step .d { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.45; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 10px 0;
    font-size: 12px; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .diagram-hint { margin: 0 0 14px; font-size: 12px; color: var(--muted); max-width: 52em; }
  .swatch-solid { width: 22px; height: 2px; background: var(--accent); }
  .swatch-dash { width: 22px; border-top: 2px dashed var(--faint); }
  .swatch-data { width: 22px; border-top: 1.5px dashed #a65b32; }
  .swatch-create { width: 22px; height: 2.5px; background: #b45309; }
  .swatch-input { width: 22px; border-top: 2px dotted #7c3aed; }
  .swatch-out-file {
    width: 18px; height: 12px; box-sizing: border-box;
    border: 1.5px dashed #c45c26; background: #fffaf5; border-radius: 2px;
  }
  .swatch-out-skill {
    width: 18px; height: 12px; box-sizing: border-box;
    border: 1.5px solid #0f766e; background: #ffffff; border-radius: 2px;
  }

  .diagram-wrap {
    overflow-x: auto; background: var(--panel);
    border: 1px solid var(--line); padding: 12px 10px 8px;
    position: relative;
  }
  .edge-tip {
    display: none;
    position: absolute;
    z-index: 30;
    max-width: 260px;
    padding: 8px 10px;
    background: #1a1f24;
    color: #fff;
    font-size: 12px;
    line-height: 1.45;
    border-radius: 4px;
    pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .edge-tip.is-on { display: block; }
  .edge-hit { cursor: help; }
  .edge-stroke { pointer-events: stroke; }
  svg text { font-family: inherit; pointer-events: none; }
  .node { cursor: pointer; }
  .node.dim { opacity: 0.18; }
  .aux-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px 14px 14px;
  }
  .aux-panel .aux-title {
    margin: 0 0 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  .aux-panel .aux-sub {
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .aux-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .aux-chip {
    appearance: none;
    border: 1px dashed #c5d0da;
    background: #f3f6f8;
    color: #5a6b78;
    font: 500 12px/1.2 "Noto Sans SC", sans-serif;
    padding: 9px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .aux-chip:hover { border-color: var(--accent); color: var(--ink); }
  .aux-chip.active {
    border-style: solid;
    border-color: var(--accent);
    background: #d8efec;
    color: var(--ink);
  }
  .aux-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .conn { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .conn-item {
    font-size: 12px; background: var(--bg); border: 1px solid var(--line);
    padding: 3px 7px;
  }
  .foot {
    margin-top: 32px; font-size: 12px; color: var(--faint);
    border-top: 1px solid var(--line); padding-top: 14px;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>PM Skills - 供应商管理系列</h1>
    <div class="series-intro">
      <p>面向多直采包的供应商管理，本系列把建项、履约、请款、变更、出账预测与通讯录沉淀为可复用的 Skill，用来做进度跟踪、台账记录、风险预判、节点提醒与资金计划。设计上<strong>不另起一套流程</strong>：以项目为单位<strong>绑定公司邮箱</strong>，各方正式往来只需<strong>抄送该地址</strong>，关键节点邮件即可进入系统；邮局前台收信分拣，Skill 0–3 各管一段履约链路，现金流只读算出账、通讯录用群消息收联系人——<strong>人继续写邮件</strong>，系统跟在后面完成跟踪、记录与提醒。</p>
    </div>

    <div id="panels"></div>

    <p class="foot">有示例的产出项可直接点开查看</p>
  </div>

function demoHref(file) {
  const raw = String(file || "");
  if (/^https?:\/\//i.test(raw) || raw.startsWith("/")) return raw;
  const name = raw.split("/").pop();
  try { return new URL("demos/" + name, location.href).href; }
  catch (e) { return "demos/" + name; }
}
function demoLink(label, file, cls) {
  const klass = cls ? ` class="${cls}"` : "";
  const href = demoHref(file);
  const name = String(file || "").split("/").pop() || "";
  const isHtml = /\.html?$/i.test(name);
  const dl = isHtml ? "" : ` download="${esc(name)}"`;
  return `<a${klass} href="${esc(href)}"${dl}>${esc(label)}</a>`;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function ioRow(items, withDemo) {

      : "";
    return `<li>${esc(x.what)} <span class="fmt">${esc(x.fmt)}</span>${demo ? " " + demo : ""}</li>`;
  }).join("");
}

}

}

function centerOf(id) {
  const n = LAYOUT[id];
  return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
}
function borderPoint(id, toward) {
  const box = LAYOUT[id];
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  const dx = toward.x - cx, dy = toward.y - cy;
  if (Math.abs(dx) < 1e-6 && Math.abs(dy) < 1e-6) return { x: cx, y: cy };
  const hw = box.w / 2, hh = box.h / 2;
  const sx = Math.abs(dx) < 1e-6 ? Infinity : hw / Math.abs(dx);
  const sy = Math.abs(dy) < 1e-6 ? Infinity : hh / Math.abs(dy);
  const t = Math.min(sx, sy);
  return { x: cx + dx * t, y: cy + dy * t };
}
function edgeGeometry(from, to, zone, opts) {
  const fromBox = LAYOUT[from], toBox = LAYOUT[to];
  const ac = centerOf(from), bc = centerOf(to);
  const slot = (opts && opts.slot) || 0;
  const slotCount = Math.max(1, (opts && opts.slotCount) || 1);

  // 核心流程：一律从右出、从左进；同行直连，不同行统一直角折线
  if (zone === "flow") {
    const a = { x: fromBox.x + fromBox.w, y: fromBox.y + fromBox.h / 2 };
    const tip = { x: toBox.x, y: toBox.y + toBox.h / 2 };
    let d, mid, midFrom, label;
    if (Math.abs(a.y - tip.y) < 8) {
      d = `M ${a.x} ${a.y} L ${tip.x} ${tip.y}`;
      mid = { x: (a.x + tip.x) / 2, y: a.y };
      midFrom = { x: mid.x - 8, y: a.y };
      label = { x: mid.x, y: a.y - LABEL_DY, anchor: "middle" };
    } else {
      const midX = a.x + Math.max(36, (tip.x - a.x) * 0.42);
      d = `M ${a.x} ${a.y} L ${midX} ${a.y} L ${midX} ${tip.y} L ${tip.x} ${tip.y}`;
      mid = { x: midX, y: (a.y + tip.y) / 2 };
      midFrom = { x: (midX + tip.x) / 2, y: tip.y };
      label = { x: midX + LABEL_DX, y: mid.y, anchor: "start" };
    }
    return { mid, midFrom, tip, d, label };
  }

  // 产出连线
  if (zone === "feed") {
    // 同行产出（如台账→现金流）：从顶边出、顶边进；横折走在产出框上方
    if (Math.abs(ac.y - bc.y) < 24 && Math.abs(ac.x - bc.x) > 40) {
      const a = { x: ac.x, y: fromBox.y };
      const tip = { x: bc.x, y: toBox.y };
      const midY = OUT_Y - 28;
      const d = `M ${a.x} ${a.y} L ${a.x} ${midY} L ${tip.x} ${midY} L ${tip.x} ${tip.y}`;
      const lx = (a.x + tip.x) / 2;
      return {
        mid: { x: lx, y: midY },
        midFrom: { x: tip.x, y: (midY + tip.y) / 2 },
        tip,
        d,
        label: { x: lx, y: midY - LABEL_DY, anchor: "middle" },
      };
    }

    // 流程 → 产出：竖下到连线区正中 → 横走 → 再竖下
    // 标签规则（避免重叠）：
    // - 同一核心流程连出多条 → 字在「下半截」竖线左侧（通向各产出，x 不同）
    // - 多条汇入同一产出 → 字在「上半截」竖线左侧，且 Y 限制在连线区内
    // - 只有一条 → 字也可在上半截，但仍须落在连线区内（别钻进核心流程模块）
    const slotFrom = (opts && opts.slotFrom) || 0;
    const countFrom = Math.max(1, (opts && opts.countFrom) || 1);
    const aTop = { x: ac.x, y: fromBox.y + fromBox.h };
    const tipBot = { x: bc.x, y: toBox.y };
    const midY = WIRE_Y;
    const d = Math.abs(aTop.x - tipBot.x) < 6
      ? `M ${aTop.x} ${aTop.y} L ${tipBot.x} ${tipBot.y}`
      : `M ${aTop.x} ${aTop.y} L ${aTop.x} ${midY} L ${tipBot.x} ${midY} L ${tipBot.x} ${tipBot.y}`;

    const wireTop = BANDS[2].y;
    const upperY0 = Math.max(aTop.y, wireTop);
    const upperMidY = (upperY0 + midY) / 2;
    // 默认先放上半截；点选后再由 placeFeedLabels 按「点流程多出口 / 点产出」改到下半截或保持上半截
    return {
      mid: { x: (aTop.x + tipBot.x) / 2, y: midY },
      midFrom: { x: tipBot.x, y: (midY + tipBot.y) / 2 },
      tip: tipBot,
      d,
      label: { x: aTop.x - LABEL_DX, y: upperMidY, anchor: "end" },
    };
  }

  const a = borderPoint(from, bc), tip = borderPoint(to, ac);
  const mx = (a.x + tip.x) / 2, my = (a.y + tip.y) / 2;
  const dx = tip.x - a.x, dy = tip.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const bend = Math.min(22, len * 0.1);
  const ox = (-dy / len) * bend, oy = (dx / len) * bend;
  const c = { x: mx + ox, y: my + oy };
  const mid = { x: 0.25 * a.x + 0.5 * c.x + 0.25 * tip.x, y: 0.25 * a.y + 0.5 * c.y + 0.25 * tip.y };
  const midFrom = { x: 0.5 * (a.x + c.x), y: 0.5 * (a.y + c.y) };
  return { mid, midFrom, tip, d: `M ${a.x} ${a.y} Q ${c.x} ${c.y} ${tip.x} ${tip.y}`, label: { x: mid.x, y: mid.y - LABEL_DY, anchor: "middle" } };
}
function arrowHeadPath(tip, from, size = 8) {
  const dx = tip.x - from.x, dy = tip.y - from.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len, px = -uy, py = ux;
  const base = { x: tip.x - ux * size, y: tip.y - uy * size };
  const left = { x: base.x + px * size * 0.55, y: base.y + py * size * 0.55 };
  const right = { x: base.x - px * size * 0.55, y: base.y - py * size * 0.55 };
  return `M ${tip.x} ${tip.y} L ${left.x} ${left.y} L ${right.x} ${right.y} Z`;
}
function nodeZone(id) {
  if (id === "mail") return "mail";
  if (FLOW_IDS.includes(id)) return "flow";
  if (OUTPUT_IDS.includes(id)) return "output";
  if (AUX_IDS.includes(id)) return "aux";
  return "other";
}
function feedEdgesOf(outputId) {
  return EDGES.filter((e) => e.zone === "feed" && e.to === outputId);
}
function feedersOf(outputId) {
  return feedEdgesOf(outputId).map((e) => e.from);
}
function feederNoteHtml(outputId) {
  const edges = feedEdgesOf(outputId);
  if (!edges.length) return "";
  const lines = edges.map((e) => {
    const name = skillById[e.from]?.short || e.from;
    return `${name} · ${e.kind}：${e.label}`;
  }).join("；");
  const extra = outputId === "critical"
    ? " 进度原始表通常先经「进度转 Excel」再进来（辅助工具）。"
    : "";
  return `<div class="intent-box"><p class="t">谁在喂它（创建 / 写入 / 只读）</p><p class="b">${esc(lines)}。${esc(extra)}图上只显示短标签；鼠标移到线上可看明细。</p></div>`;
}

        <li class="flow-step"><span class="flow-num">2</span><div><p class="n">邮局收信并归档原件</p><p class="d">先留底，再判断这封信属于哪一类业务。</p></div></li>
        <li class="flow-step"><span class="flow-num">3</span><div><p class="n">派给对应流程</p><p class="d">新建 / 建包 / 请款 / 变更各办各的；输出与辅助工具不经邮局派单。</p></div></li>
      </ol>
      <div style="margin-top:14px">${ioBoxes(s.takes, s.gives)}</div>`
    : ioBoxes(s.takes, s.gives);

  return `<div class="card">
    <div class="card-head"><span>${esc(s.short)}</span><span class="badge">${esc(s.layer)}</span></div>

    <p class="detail-summary">${esc(s.role)}</p>
    ${intentBlock}${feederBlock}
    <div class="detail-section is-primary">
      <p class="detail-label">${primaryLabel}</p>

    </div>
    <div class="detail-section">
      <p class="detail-label">职责范围</p>
      <ul class="list">${s.does.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
    </div>
    <div class="detail-section is-secondary">
      <p class="detail-label">边界</p>
      <ul class="list muted">${s.doesNot.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
      ${related.length ? `<div class="conn" style="margin-top:10px">${conns}</div>` : ""}
    </div>
  </div>`;
}

function renderConstellationSvg() {
  const viewW = VIEW_W, viewH = VIEW_H;
  const colorFlow = "#216e68", colorMail = "#8a9aaa";
  const colorCreate = "#b45309", colorWrite = "#c45c26", colorInput = "#7c3aed";
  const kindStroke = (kind) => {
    if (kind === "创建") return colorCreate;
    if (kind === "写入") return colorWrite;
    if (kind === "只读") return colorInput;
    return colorWrite;
  };
  let bandsHtml = "";
  BANDS.forEach((band) => {
    bandsHtml += `<rect x="0" y="${band.y}" width="${viewW}" height="${band.h}" fill="${band.tone}" opacity="0.95"/>`;
    if (band.label) {
      bandsHtml += `<text x="14" y="${band.y + 18}" fill="#8a9aaa" font-size="11">${esc(band.label)}</text>`;
    }
  });

  const feedCountTo = {}, feedCountFrom = {};
  EDGES.forEach((e) => {
    if (e.zone !== "feed") return;
    feedCountTo[e.to] = (feedCountTo[e.to] || 0) + 1;
    feedCountFrom[e.from] = (feedCountFrom[e.from] || 0) + 1;
  });
  const feedSlotTo = {}, feedSlotFrom = {};
  let edgesHtml = "";
  EDGES.forEach((e) => {
    const zone = e.zone || "flow";
    let slot = 0, slotCount = 1, slotFrom = 0, countFrom = 1;
    if (zone === "feed") {
      slot = feedSlotTo[e.to] || 0;
      feedSlotTo[e.to] = slot + 1;
      slotCount = feedCountTo[e.to] || 1;
      slotFrom = feedSlotFrom[e.from] || 0;
      feedSlotFrom[e.from] = slotFrom + 1;
      countFrom = feedCountFrom[e.from] || 1;
    }
    const geo = edgeGeometry(e.from, e.to, zone, { slot, slotCount, slotFrom, countFrom });
    let stroke = colorFlow, width = 2.6, dash = "";
    if (zone === "mail") {
      stroke = colorMail; width = 1.4; dash = ' stroke-dasharray="5 4"';
    } else if (zone === "feed") {
      stroke = kindStroke(e.kind);
      width = e.kind === "创建" ? 2.4 : 2;
      if (e.kind === "只读") dash = ' stroke-dasharray="2 4"';
      else if (e.kind === "写入") dash = ' stroke-dasharray="6 4"';
      else dash = "";
    }
    const fromName = skillById[e.from]?.short || e.from;
    const toName = skillById[e.to]?.short || e.to;
    const tip = zone === "feed"
      ? (e.kind === "只读"
          ? `${toName} ← 只读 — ${fromName}：${e.label}`
          : `${fromName} → ${toName} · ${e.kind}：${e.label}`)
      : `${fromName} → ${toName} · ${e.label}`;
    const tipAttr = esc(tip);

    if (zone === "feed") {
      const tag = KIND_LABEL[e.kind] || e.kind;
      const lb = geo.label || { x: geo.mid.x, y: geo.mid.y - LABEL_DY, anchor: "middle" };
      const arrow = arrowHeadPath(geo.tip, geo.midFrom, 7);
      edgesHtml += `<g class="edge-hit" data-from="${e.from}" data-to="${e.to}" data-zone="${zone}" data-tip="${tipAttr}" style="pointer-events:none">
        <path class="edge edge-stroke" data-from="${e.from}" data-to="${e.to}" data-zone="${zone}" data-kind="${e.kind}" d="${geo.d}" fill="none" stroke="${stroke}" stroke-width="${width}"${dash} style="pointer-events:stroke"/>
        <path class="edge edge-arrow" data-from="${e.from}" data-to="${e.to}" data-zone="${zone}" d="${arrow}" fill="${stroke}" stroke="${stroke}" stroke-width="1" style="pointer-events:none"/>
        <text class="edge-label" data-from="${e.from}" data-to="${e.to}" data-zone="${zone}" x="${lb.x}" y="${lb.y}" text-anchor="${lb.anchor}" fill="${stroke}" font-size="11" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke fill" style="pointer-events:none">${esc(tag)}</text>
      </g>`;
    } else {
      edgesHtml += `<path class="edge" data-from="${e.from}" data-to="${e.to}" data-zone="${zone}" data-kind="${e.kind}" d="${geo.d}" fill="none" stroke="${stroke}" stroke-width="${width}"${dash}/>`;
      if (zone === "flow") {
        edgesHtml += `<path class="edge" data-from="${e.from}" data-to="${e.to}" data-zone="${zone}" d="${arrowHeadPath(geo.tip, geo.midFrom, 8)}" fill="${colorFlow}" stroke="${colorFlow}"/>`;
      }
    }
  });

  const diagramIds = ["mail", ...FLOW_IDS, ...OUTPUT_IDS];
  let nodesHtml = "";
  diagramIds.forEach((id) => {
    const s = skillById[id];
    const box = LAYOUT[id];
    const zone = nodeZone(id);
    const isMail = zone === "mail";
    const isFlow = zone === "flow";
    const isOut = zone === "output";
    const outArtifact = isOut && isOutputArtifact(id);
    const outSkill = isOut && isOutputSkill(id);
    const fill = isMail ? colorFlow : outArtifact ? "#fffaf5" : outSkill ? "#ffffff" : "#ffffff";
    const stroke = isMail ? colorFlow : isFlow ? "#15232e" : outSkill ? "#0f766e" : "#c45c26";
    const sw = isMail || isFlow ? 2 : 1.5;
    const dashAttr = outArtifact ? ` stroke-dasharray="4 3"` : "";
    const titleColor = isMail ? "#fff" : "#15232e";
    const subColor = isMail ? "#d8efec" : "#8a9aaa";
    const titleY = isOut ? 24 : 22;
    const subY = isOut ? 42 : 40;
    const titleSize = isMail ? 13 : isFlow ? 12 : (isOut ? 10.5 : 11);
    const subText = outArtifact ? "单纯产出" : (s.skillName || (isOut ? "产出" : s.layer));
    nodesHtml += `<g class="node" data-id="${id}" data-zone="${zone}" data-out="${outArtifact ? "artifact" : outSkill ? "skill" : ""}">
      <rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dashAttr}/>
      <text x="${box.x + box.w / 2}" y="${box.y + titleY}" text-anchor="middle" fill="${titleColor}" font-size="${titleSize}" font-weight="600">${esc(s.short)}</text>
      <text x="${box.x + box.w / 2}" y="${box.y + subY}" text-anchor="middle" fill="${subColor}" font-size="9" font-family="IBM Plex Mono, monospace">${esc(subText)}</text>
    </g>`;
  });

  return `<svg id="constellation" viewBox="0 0 ${viewW} ${viewH}" width="100%" style="display:block;min-width:900px">
    ${bandsHtml}${edgesHtml}${nodesHtml}
  </svg>`;
}

function placeFeedLabels(selZone) {
  // 按当前点选决定字在上半截还是下半截（避免点产出时误用「流程多出口」逻辑）
  const visible = Array.from(document.querySelectorAll(".edge-hit")).filter(
    (g) => parseFloat(g.style.opacity || "0") > 0.5
  );
  const fromCount = {};
  visible.forEach((g) => {
    fromCount[g.dataset.from] = (fromCount[g.dataset.from] || 0) + 1;
  });

  visible.forEach((g) => {
    const a = g.dataset.from, b = g.dataset.to;
    const label = g.querySelector(".edge-label");
    if (!label || !LAYOUT[a] || !LAYOUT[b]) return;

    // 产出↔产出：字固定在横线正上方居中（不要被卡片挡住）
    if (OUTPUT_IDS.includes(a) && OUTPUT_IDS.includes(b)) {
      const ac = centerOf(a), bc = centerOf(b);
      const midY = OUT_Y - 28;
      const lx = (ac.x + bc.x) / 2;
      label.setAttribute("x", String(lx));
      label.setAttribute("y", String(midY - LABEL_DY));
      label.setAttribute("text-anchor", "middle");
      return;
    }

    const fromBox = LAYOUT[a], toBox = LAYOUT[b];
    const ac = centerOf(a), bc = centerOf(b);
    const midY = WIRE_Y;
    const wireTop = BANDS[2].y;
    const upperMidY = (Math.max(fromBox.y + fromBox.h, wireTop) + midY) / 2;
    const lowerMidY = (midY + toBox.y) / 2;

    // 只有「点的是核心流程，且该流程当前可见连出多于 1 条」才用下半截
    const useLower = selZone === "flow" && (fromCount[a] || 0) > 1;
    if (useLower) {
      label.setAttribute("x", String(bc.x - LABEL_DX));
      label.setAttribute("y", String(lowerMidY));
    } else {
      label.setAttribute("x", String(ac.x - LABEL_DX));
      label.setAttribute("y", String(upperMidY));
    }
    label.setAttribute("text-anchor", "end");
  });
}

function applySelection() {
  const tipEl = document.getElementById("edge-tip");
  if (tipEl) {
    tipEl.hidden = true;
    tipEl.classList.remove("is-on");
    tipEl.textContent = "";
  }
  const zone = selected ? nodeZone(selected) : null;
  const linked = new Set();
  if (selected) {
    linked.add(selected);
    if (zone === "output") {
      feedersOf(selected).forEach((id) => linked.add(id));
      EDGES.forEach((e) => {
        if (e.zone === "feed" && e.from === selected) linked.add(e.to);
      });
    } else if (zone === "flow") {
      FLOW_IDS.forEach((id) => linked.add(id));
      EDGES.forEach((e) => {
        if (e.zone === "feed" && e.from === selected) linked.add(e.to);
      });
    } else if (zone === "mail") {
      FLOW_IDS.forEach((id) => linked.add(id));
      linked.add("mail");
    } else if (zone === "aux") {
      linked.add(selected);
    }
  }

  document.querySelectorAll(".node").forEach((n) => {
    const id = n.dataset.id;
    const dim = !!selected && !linked.has(id);
    n.classList.toggle("dim", dim);
    const rect = n.querySelector("rect");
    if (!rect) return;
    const z = nodeZone(id);
    const isSel = selected === id;
    const isLinked = !!selected && linked.has(id) && !isSel;
    const outKind = n.dataset.out || "";
    if (isSel || isLinked) {
      rect.setAttribute("stroke", "#0f766e");
      rect.setAttribute("stroke-width", "2.6");
      rect.removeAttribute("stroke-dasharray");
      if (isSel && z !== "mail") rect.setAttribute("fill", "#d8efec");
      else if (isLinked && z === "output") rect.setAttribute("fill", "#fff3e8");
      else if (z === "mail") rect.setAttribute("fill", "#0f766e");
      else rect.setAttribute("fill", "#ffffff");
    } else {
      if (z === "mail") {
        rect.setAttribute("stroke", "#216e68");
        rect.setAttribute("stroke-width", "2");
        rect.removeAttribute("stroke-dasharray");
        rect.setAttribute("fill", "#216e68");
      } else if (z === "flow") {
        rect.setAttribute("stroke", "#15232e");
        rect.setAttribute("stroke-width", "2");
        rect.removeAttribute("stroke-dasharray");
        rect.setAttribute("fill", "#ffffff");
      } else if (outKind === "skill") {
        rect.setAttribute("stroke", "#0f766e");
        rect.setAttribute("stroke-width", "1.5");
        rect.removeAttribute("stroke-dasharray");
        rect.setAttribute("fill", "#ffffff");
      } else {
        rect.setAttribute("stroke", "#c45c26");
        rect.setAttribute("stroke-width", "1.5");
        rect.setAttribute("stroke-dasharray", "4 3");
        rect.setAttribute("fill", "#fffaf5");
      }
    }
  });

  document.querySelectorAll(".edge-hit").forEach((g) => {
    const a = g.dataset.from, b = g.dataset.to;
    let opacity = 0;
    if (!selected) opacity = 0;
    else if (zone === "output") opacity = (b === selected || a === selected) ? 1 : 0;
    else if (zone === "flow") opacity = a === selected ? 1 : 0;
    else opacity = 0;
    g.style.opacity = String(opacity);
    g.style.pointerEvents = opacity > 0.5 ? "auto" : "none";
    const stroke = g.querySelector(".edge-stroke");
    if (stroke) stroke.style.pointerEvents = opacity > 0.5 ? "stroke" : "none";
  });

  placeFeedLabels(zone);

  document.querySelectorAll(".edge").forEach((e) => {
    if (e.closest(".edge-hit")) return;
    const a = e.dataset.from, b = e.dataset.to;
    const ez = e.dataset.zone || "flow";
    let opacity = 0;
    if (!selected) {
      if (ez === "flow") opacity = 1;
      else if (ez === "mail") opacity = 0.18;
      else opacity = 0;
    } else if (zone === "output") {
      opacity = ez === "flow" ? 0.18 : 0;
    } else if (zone === "flow") {
      opacity = ez === "flow" ? 1 : 0;
    } else if (zone === "mail") {
      opacity = (ez === "mail") ? 1 : (ez === "flow" ? 0.35 : 0);
    } else {
      opacity = ez === "flow" ? 0.15 : 0;
    }
    e.style.opacity = String(opacity);
  });

  document.querySelectorAll(".aux-chip").forEach((chip) => {
    chip.classList.toggle("active", chip.dataset.id === selected);
  });

  const detail = document.getElementById("skill-detail");
  if (detail) detail.innerHTML = renderSkillDetail(selected);
}

  return `<div class="aux-panel">

      <span><i class="swatch-out-skill"></i>绿实框 = 独立 Skill 产出</span>
    </div>
    <p class="diagram-hint">产出分两类：虚框是流程顺手写下的表；实框绿边是有自己算法/入口的 Skill。连线箭头指向去向：创建/写入 = 数据写进谁；只读 = 谁来读（如台账 → 现金流，是现金流在读台账）。</p>
    ${renderAuxPanel()}
    <div id="skill-detail">${renderSkillDetail(selected)}</div>
  </div>`;
}


function renderBizPanel(biz, extraHtml) {
  const intentBlock = biz.intent
    ? `<div class="intent-box"><p class="t">设计意图</p><p class="b">${esc(biz.intent)}</p></div>`
    : "";
  return `<div class="card">
    <div class="card-head"><span>${esc(biz.title)}</span><span class="badge">${biz.id.toUpperCase()}</span></div>
    ${biz.skillName ? `<p class="detail-meta" style="margin-top:-4px">技能名：<code>${esc(biz.skillName)}</code></p>` : ""}
    <p class="detail-summary">${esc(biz.one)}</p>
    ${intentBlock}${extraHtml || ""}
    <p class="detail-meta">适用：${esc(biz.when)}</p>
    <div class="detail-section is-primary">
      <p class="detail-label">流程顺序</p>
      ${flowSteps(biz.steps)}
    </div>
    <div class="detail-section">
      <p class="detail-label">输入与产出</p>
      ${ioBoxes(biz.takes, biz.gives)}
    </div>
    <div class="detail-section is-secondary">
      <p class="detail-label">边界与分工</p>
      <ul class="list muted">${biz.not.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <div class="note-box" style="margin-top:10px"><div class="b">${esc(biz.tip)}</div></div>
    </div>
  </div>`;
}

function bindEdgeTips() {
  const svg = document.getElementById("constellation");
  const wrap = document.querySelector(".diagram-wrap");
  const tip = document.getElementById("edge-tip");
  if (!svg || !wrap || !tip) return;

  const hide = () => {
    tip.hidden = true;
    tip.classList.remove("is-on");
    tip.textContent = "";
  };

  const showAt = (text, clientX, clientY) => {
    tip.textContent = text;
    tip.hidden = false;
    tip.classList.add("is-on");
    const rect = wrap.getBoundingClientRect();
    const pad = 12;
    let left = clientX - rect.left + wrap.scrollLeft + pad;
    let top = clientY - rect.top + wrap.scrollTop + pad;
    // 先显示再量宽，避免贴出边界
    tip.style.left = "0px";
    tip.style.top = "0px";
    const tw = tip.offsetWidth || 160;
    const th = tip.offsetHeight || 40;
    if (left + tw > wrap.scrollLeft + rect.width - 8) left = clientX - rect.left + wrap.scrollLeft - tw - pad;
    if (top + th > wrap.scrollTop + rect.height - 8) top = clientY - rect.top + wrap.scrollTop - th - pad;
    if (left < wrap.scrollLeft + 4) left = wrap.scrollLeft + 4;
    if (top < wrap.scrollTop + 4) top = wrap.scrollTop + 4;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  };

  const toSvgPoint = (clientX, clientY) => {
    const pt = svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    return pt.matrixTransform(ctm.inverse());
  };

  const nearestVisible = (svgX, svgY) => {
    let best = null;
    let bestDist = 10; // 只认贴线附近，空白处不弹
    document.querySelectorAll(".edge-hit").forEach((g) => {
      if (parseFloat(g.style.opacity || "0") < 0.5) return;
      const path = g.querySelector(".edge-stroke");
      if (!path || typeof path.getTotalLength !== "function") return;
      const len = path.getTotalLength();
      if (!len) return;
      const steps = Math.max(12, Math.ceil(len / 8));
      for (let i = 0; i <= steps; i++) {
        const p = path.getPointAtLength((len * i) / steps);
        const d = Math.hypot(p.x - svgX, p.y - svgY);
        if (d < bestDist) {
          bestDist = d;
          best = g;
        }
      }
    });
    return best;
  };

  svg.addEventListener("mousemove", (ev) => {
    // 落在节点上时不抢说明
    if (ev.target.closest && ev.target.closest(".node")) {
      hide();
      return;
    }
    const loc = toSvgPoint(ev.clientX, ev.clientY);
    if (!loc) { hide(); return; }
    const hit = nearestVisible(loc.x, loc.y);
    if (!hit) { hide(); return; }
    showAt(hit.dataset.tip || "", ev.clientX, ev.clientY);
  });
  svg.addEventListener("mouseleave", hide);
  wrap.addEventListener("scroll", hide);
}

function mount() {
  document.getElementById("panels").innerHTML = renderStar();
  document.querySelectorAll(".node").forEach((n) => {
    n.addEventListener("click", () => {
      const id = n.dataset.id;
      selected = selected === id ? null : id;
      applySelection();
    });
  });
  document.querySelectorAll(".aux-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const id = chip.dataset.id;
      selected = selected === id ? null : id;
      applySelection();
    });
  });
  bindEdgeTips();
  applySelection();
}

mount();


</script>
