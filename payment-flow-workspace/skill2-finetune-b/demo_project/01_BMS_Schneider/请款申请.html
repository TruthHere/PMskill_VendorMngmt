<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>请款申请 · BMS</title>
<style>
  :root {
    --page: #eef0f4;
    --surface: #fff;
    --border: #dfe3ea;
    --ink: #141418;
    --muted: #52525b;
    --blue: #2563eb;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--page);
    color: var(--ink);
    padding: 32px 16px 48px;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px 28px;
    box-shadow: 0 8px 24px rgba(20,20,24,.06);
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
  }
  .readonly { background: #f6f7f9; color: var(--muted); }
  .full { grid-column: 1 / -1; }
  .section { margin-top: 22px; }
  .section h2 { font-size: 15px; margin-bottom: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint.warn { color: #b45309; }
  .checklist { list-style: none; }
  .checklist li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    appearance: none;
    border: none;
    background: var(--blue);
    color: #fff;
    font: inherit;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  button.secondary { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  pre {
    margin-top: 16px;
    padding: 12px;
    background: #f6f7f9;
    border-radius: 8px;
    font-size: 11px;
    overflow: auto;
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <article class="card">
    <h1>请款申请</h1>
    <p class="sub">Schneider Electric (China) Co., Ltd. · BMS · Apple SARL Phase 5 Build Out Project</p>

    <div class="grid">
      <div>
        <label>PAYMENT NO</label>
        <input class="readonly" id="payment_no" value="2" readonly>
      </div>
      <div>
        <label>PO Number</label>
        <input class="readonly" id="po_number" value="PO-F26651-BMS" readonly>
      </div>
      <div>
        <label>合同/PO 金额（不含税）</label>
        <input class="readonly" id="contract_value" value="1000000" readonly>
      </div>
      <div>
        <label>已认证请款累计</label>
        <input class="readonly" id="previously_certified" value="100000" readonly>
      </div>
      <div class="full">
        <label>付款节点总览</label>
        <textarea class="readonly" id="nodes_overview" rows="3" readonly>1. 预付款 / Advance  10%
2. 到货 / Delivery  30%
3. 验收 / Acceptance  60%</textarea>
      </div>
    </div>

    <div class="section">
      <h2>本次请款（必填）</h2>
      <div class="grid">
        <div class="full">
          <label>请款节点</label>
          <select id="claim_node"><option value="预付款 / Advance">预付款 / Advance（已请）</option>
<option value="到货 / Delivery" selected>到货 / Delivery</option>
<option value="验收 / Acceptance">验收 / Acceptance</option></select>
        </div>
        <div>
          <label>本次金额（不含税）</label>
          <input id="claim_amount" type="number" step="0.01" min="0" value="300000">
          <p class="hint" id="amount_hint">参考：基价 1000000 × 节点比例 ≈ 300000（仅提示）</p>
        </div>
        <div>
          <label>Vendor Reference Number</label>
          <input id="vendor_ref" placeholder="PO 上的供应商编号" value="">
        </div>
        <div>
          <label>联系人</label>
          <input id="contact_name" value="">
        </div>
        <div>
          <label>手机</label>
          <input id="contact_mobile" value="">
        </div>
        <div>
          <label>公司电话</label>
          <input id="office_phone" value="">
        </div>
        <div class="full">
          <label>公司地址</label>
          <input id="office_address" value="">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>支持文件 Checklist</h2>
      <p class="hint">请与请款单一并提交下列文件（勾选仅作自检，不上传到本页）。</p>
      <ul class="checklist" id="checklist"><li><label><input type="checkbox"> 请款单</label></li><li><label><input type="checkbox"> 到货签认单</label></li><li><label><input type="checkbox"> 送货单/装箱单</label></li><li><label><input type="checkbox"> 发票</label></li></ul>
    </div>

    <div class="actions">
      <button type="button" id="btn_download">下载 claim_response.json</button>
      <button type="button" class="secondary" id="btn_preview">预览 JSON</button>
    </div>
    <pre id="preview"></pre>
  </article>
</div>

<script type="application/json" id="boot">{"project_name": "Apple SARL Phase 5 Build Out Project", "division": "212-4", "vendor_name": "Schneider Electric (China) Co., Ltd.", "work_package": "BMS", "contract_value_excl_tax": 1000000.0, "vat_note_pct": 9, "payment_no": 2, "nodes": [{"name": "预付款 / Advance", "pct": "10%", "pct_fraction": 0.1, "checklist": ["请款单", "PO/合同复印件", "发票"], "claimed": true}, {"name": "到货 / Delivery", "pct": "30%", "pct_fraction": 0.3, "checklist": ["请款单", "到货签认单", "送货单/装箱单", "发票"], "claimed": false}, {"name": "验收 / Acceptance", "pct": "60%", "pct_fraction": 0.6, "checklist": ["请款单", "验收签认单", "测试/调试报告", "发票"], "claimed": false}], "default_checklist": ["请款单", "相关签认单或支持性文件", "发票"]}</script>
<script>
(function () {
  const boot = JSON.parse(document.getElementById("boot").textContent);
  const nodeSelect = document.getElementById("claim_node");
  const amountInput = document.getElementById("claim_amount");
  const hint = document.getElementById("amount_hint");
  const checklist = document.getElementById("checklist");

  function money(n) {
    if (n == null || n === "") return null;
    const v = Number(n);
    return Number.isFinite(v) ? v : null;
  }

  function renderChecklist(items) {
    checklist.innerHTML = (items || []).map(function (t) {
      return "<li><label><input type=\"checkbox\"> " + t + "</label></li>";
    }).join("") || "<li>（无清单）</li>";
  }

  function onNodeChange() {
    const name = nodeSelect.value;
    const node = (boot.nodes || []).find(function (n) { return n.name === name; }) || {};
    renderChecklist(node.checklist || boot.default_checklist || []);
    const base = money(boot.contract_value_excl_tax);
    const pct = node.pct_fraction;
    if (base != null && pct != null) {
      const suggested = Math.round(base * pct * 100) / 100;
      if (!amountInput.value) amountInput.value = String(suggested);
      hint.textContent = "参考：基价 " + base + " × " + Math.round(pct * 1000) / 10 + "% ≈ " + suggested + "（仅提示）";
      hint.className = "hint";
    } else {
      hint.textContent = "无法自动估算比例；请按合同填写不含税金额。";
      hint.className = "hint";
    }
  }

  nodeSelect.addEventListener("change", onNodeChange);
  onNodeChange();

  function buildPayload() {
    const base = money(document.getElementById("contract_value").value) || money(boot.contract_value_excl_tax);
    return {
      payment_no: Number(document.getElementById("payment_no").value) || boot.payment_no,
      project_name: boot.project_name || "",
      division: boot.division || "",
      vendor_name: boot.vendor_name || "",
      work_package: boot.work_package || "",
      vendor_ref: document.getElementById("vendor_ref").value.trim(),
      po_number: document.getElementById("po_number").value.trim(),
      po_value_excl_tax: base,
      contract_value_excl_tax: base,
      contact_name: document.getElementById("contact_name").value.trim(),
      contact_mobile: document.getElementById("contact_mobile").value.trim(),
      office_phone: document.getElementById("office_phone").value.trim(),
      office_address: document.getElementById("office_address").value.trim(),
      claim_node: nodeSelect.value,
      claim_amount_excl_tax: money(amountInput.value),
      variations_to_date: 0,
      previously_certified: money(document.getElementById("previously_certified").value) || 0,
      nodes_overview: document.getElementById("nodes_overview").value,
      vat_note_pct: boot.vat_note_pct != null ? boot.vat_note_pct : 9
    };
  }

  function download() {
    const payload = buildPayload();
    if (!payload.claim_node) { alert("请选择请款节点"); return; }
    if (payload.claim_amount_excl_tax == null) { alert("请填写本次金额（不含税）"); return; }
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "claim_response.json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  document.getElementById("btn_download").addEventListener("click", download);
  document.getElementById("btn_preview").addEventListener("click", function () {
    const pre = document.getElementById("preview");
    pre.style.display = "block";
    pre.textContent = JSON.stringify(buildPayload(), null, 2);
  });
})();
</script>
</body>
</html>
